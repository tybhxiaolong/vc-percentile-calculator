<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>肺活量百分位计算器</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #65717d;
      --line: #d8dee5;
      --surface: #ffffff;
      --panel: #f4f7fa;
      --accent: #0f7b6c;
      --accent-2: #b85c38;
      --accent-soft: #e4f3ef;
      --danger: #b42318;
      --danger-soft: #fff1f0;
      --danger-line: #f4b8b1;
      --warn: #9a5b00;
      --shadow: 0 18px 45px rgba(28, 43, 57, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #eef4f6 0%, #ffffff 48%, #f7f5f1 100%);
    }
    .shell { max-width: 1100px; margin: 0 auto; padding: 28px 18px 42px; }
    header { display: flex; justify-content: space-between; gap: 18px; align-items: flex-end; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 42px); line-height: 1.08; letter-spacing: 0; }
    .meta { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 430px; }
    .layout { display: grid; grid-template-columns: minmax(300px, 390px) 1fr; gap: 18px; align-items: start; }
    .panel, .result { background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .panel { padding: 18px; }
    .field { margin-bottom: 15px; }
    label { display: block; font-weight: 650; font-size: 14px; margin-bottom: 7px; }
    input, select {
      width: 100%; height: 44px; border: 1px solid #bac4ce; border-radius: 6px; padding: 0 12px;
      font-size: 16px; color: var(--ink); background: #fff; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,123,108,.14); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; gap: 10px; margin-top: 18px; }
    button {
      height: 44px; border: 0; border-radius: 6px; padding: 0 15px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .primary { flex: 1; background: var(--accent); color: #fff; }
    .ghost { background: #e8edf1; color: #26313b; }
    .result { min-height: 430px; overflow: hidden; }
    .summary { display: grid; grid-template-columns: 1.1fr .9fr; min-height: 210px; }
    .score { padding: 26px; background: var(--accent-soft); border-right: 1px solid var(--line); }
    .score-label { color: var(--muted); font-size: 14px; font-weight: 650; }
    .percentile { margin-top: 10px; font-size: clamp(48px, 8vw, 82px); line-height: 1; font-weight: 800; letter-spacing: 0; color: var(--accent); }
    .band { margin-top: 14px; display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; border-radius: 6px; background: #fff; color: #23303a; font-weight: 700; border: 1px solid rgba(15,123,108,.2); }
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .score-card { background: #fff; border: 1px solid rgba(15,123,108,.2); border-radius: 6px; padding: 11px 12px; }
    .score-card span { display: block; color: var(--muted); font-size: 12px; font-weight: 650; }
    .score-card strong { display: block; margin-top: 4px; font-size: 22px; line-height: 1.15; color: var(--ink); }
    .score-card.danger { background: var(--danger-soft); border-color: var(--danger-line); }
    .score-card.danger strong { color: var(--danger); }
    .detail { padding: 24px; display: grid; gap: 12px; align-content: center; }
    .metric { display: flex; justify-content: space-between; gap: 14px; padding-bottom: 10px; border-bottom: 1px solid #e6eaee; font-size: 15px; }
    .metric span:first-child { color: var(--muted); }
    .table-wrap { padding: 18px 20px 22px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: right; padding: 9px 8px; border-bottom: 1px solid #e7ebef; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 700; background: #f7f9fb; }
    .notice { margin-top: 12px; color: var(--warn); font-size: 13px; line-height: 1.5; }
    .empty { padding: 52px 28px; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .error { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: #fff3f0; color: #9b2d1f; font-size: 14px; line-height: 1.5; display: none; }
    @media (max-width: 820px) {
      header { display: block; }
      .meta { margin-top: 10px; }
      .layout { grid-template-columns: 1fr; }
      .summary { grid-template-columns: 1fr; }
      .score { border-right: 0; border-bottom: 1px solid var(--line); }
    }
    @media (max-width: 480px) {
      .row { grid-template-columns: 1fr; gap: 0; }
      .shell { padding-left: 12px; padding-right: 12px; }
      th, td { padding: 8px 5px; font-size: 12px; }
      .actions { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>肺活量百分位计算器</h1>
      </div>
      <div class="meta">基于 6-19 岁儿童青少年三维肺活量参考表；输入出生日期、测试日期、性别、身高和实测肺活量。</div>
    </header>

    <section class="layout">
      <form class="panel" id="calcForm" novalidate>
        <div class="field">
          <label for="sex">性别</label>
          <select id="sex" required>
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </div>
        <div class="row">
          <div class="field">
            <label for="birthDate">出生日期</label>
            <input id="birthDate" type="date" value="2014-01-01" required>
          </div>
          <div class="field">
            <label for="testDate">测试日期</label>
            <input id="testDate" type="date" value="2026-01-01" required>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="height">身高（cm）</label>
            <input id="height" type="number" min="90" max="210" step="0.1" value="150" required>
          </div>
          <div class="field">
            <label for="vc">肺活量（mL）</label>
            <input id="vc" type="number" min="100" max="9000" step="1" value="2500" required>
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">计算</button>
          <button class="ghost" type="button" id="resetBtn">重置</button>
        </div>
        <div class="error" id="errorBox"></div>
      </form>

      <section class="result" id="result">
        <div class="empty">输入信息后点击计算，右侧会显示理论百分位、百分位分组、评分等级、精细得分和当前年龄身高对应的主要参考值。</div>
      </section>
    </section>
  </main>

  <script>
    const DATA = JSON.parse(document.getElementById('reference-data').textContent);
    const pct = DATA.percentiles;
    const bySexAge = Object.fromEntries(Object.entries(DATA.rows).map(([sex, rows]) => [sex, groupRows(rows)]));

    function groupRows(rows) {
      const grouped = new Map();
      for (const row of rows) {
        if (!grouped.has(row.age)) grouped.set(row.age, []);
        grouped.get(row.age).push(row);
      }
      for (const list of grouped.values()) list.sort((a, b) => a.height - b.height);
      return grouped;
    }

    function clampMessage(list, message) { if (!list.includes(message)) list.push(message); }

    function interpAtHeight(rows, height, warnings) {
      let h = height;
      if (h < rows[0].height) { h = rows[0].height; clampMessage(warnings, '身高低于该年龄参考表下限，结果按最低身高网格估算。'); }
      if (h > rows[rows.length - 1].height) { h = rows[rows.length - 1].height; clampMessage(warnings, '身高高于该年龄参考表上限，结果按最高身高网格估算。'); }
      for (let i = 0; i < rows.length - 1; i++) {
        const left = rows[i], right = rows[i + 1];
        if (h >= left.height && h <= right.height) {
          const t = right.height === left.height ? 0 : (h - left.height) / (right.height - left.height);
          return left.values.map((v, idx) => v + (right.values[idx] - v) * t);
        }
      }
      return rows[rows.length - 1].values.slice();
    }

    function referenceCurve(sex, age, height) {
      const grouped = bySexAge[sex];
      const ages = Array.from(grouped.keys()).sort((a, b) => a - b);
      const warnings = [];
      if (age < ages[0] || age > ages[ages.length - 1]) {
        throw new Error(`年龄需在 ${ages[0]}-${ages[ages.length - 1]} 岁范围内。`);
      }
      let lower = ages[0], upper = ages[ages.length - 1];
      for (let i = 0; i < ages.length; i++) {
        if (ages[i] <= age) lower = ages[i];
        if (ages[i] >= age) { upper = ages[i]; break; }
      }
      const lowValues = interpAtHeight(grouped.get(lower), height, warnings);
      if (lower === upper) return { values: lowValues, warnings };
      const highValues = interpAtHeight(grouped.get(upper), height, warnings);
      const t = (age - lower) / (upper - lower);
      return { values: lowValues.map((v, i) => v + (highValues[i] - v) * t), warnings };
    }

    function percentileFromVc(values, vc) {
      let note = '';
      if (vc <= values[0]) {
        const raw = pct[0] + (vc - values[0]) * (pct[1] - pct[0]) / (values[1] - values[0]);
        return { p: Math.max(0.1, raw), note: '低于 3%，尾端为外推估计。' };
      }
      for (let i = 0; i < values.length - 1; i++) {
        if (vc >= values[i] && vc <= values[i + 1]) {
          const p = pct[i] + (vc - values[i]) * (pct[i + 1] - pct[i]) / (values[i + 1] - values[i]);
          return { p, note };
        }
      }
      const n = values.length;
      const raw = pct[n - 2] + (vc - values[n - 2]) * (pct[n - 1] - pct[n - 2]) / (values[n - 1] - values[n - 2]);
      return { p: Math.min(99.9, raw), note: '高于 97%，尾端为外推估计。' };
    }

    function grade(p) {
      if (p <= 10) return '≤10%';
      if (p <= 25) return '11%-25%';
      if (p <= 75) return '26%-75%';
      if (p <= 90) return '76%-90%';
      return '>90%';
    }

    function scoring(p) {
      if (p < 10) return { level: '不及格', score: 5 * p + 10, warning: true };
      if (p < 75) return { level: '及格', score: 4 / 15 * p + 140 / 3 };
      if (p < 90) return { level: '良好', score: 2 / 3 * p + 30 };
      return { level: '优秀', score: p };
    }

    function parseDate(value, label) {
      if (!value) throw new Error(`请选择${label}。`);
      const parts = value.split('-').map(Number);
      if (parts.length !== 3 || parts.some(n => !Number.isFinite(n))) throw new Error(`${label}格式无效。`);
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      if (date.getFullYear() !== parts[0] || date.getMonth() !== parts[1] - 1 || date.getDate() !== parts[2]) {
        throw new Error(`${label}格式无效。`);
      }
      return date;
    }

    function ageFromDates(birthValue, testValue) {
      const birthDate = parseDate(birthValue, '出生日期');
      const testDate = parseDate(testValue, '测试日期');
      if (testDate <= birthDate) throw new Error('测试日期需晚于出生日期。');
      const dayMs = 24 * 60 * 60 * 1000;
      return (testDate - birthDate) / dayMs / 365.25;
    }

    function fmt(n, digits = 0) { return Number(n).toLocaleString('zh-CN', { maximumFractionDigits: digits, minimumFractionDigits: digits }); }

    function renderResult(inputs, values, pResult, warnings) {
      const selected = [3, 10, 25, 50, 75, 90, 97].map(target => {
        const idx = pct.indexOf(target);
        return [target, values[idx]];
      });
      const rows = selected.map(([p, v]) => `<tr><td>${p}%</td><td>${fmt(v)} mL</td></tr>`).join('');
      const allNotes = [...warnings];
      if (pResult.note) allNotes.push(pResult.note);
      const score = scoring(pResult.p);
      document.getElementById('result').innerHTML = `
        <div class="summary">
          <div class="score">
            <div class="score-label">理论百分位</div>
            <div class="percentile">${fmt(pResult.p, 1)}%</div>
            <div class="band">${grade(pResult.p)}</div>
            <div class="score-grid">
              <div class="score-card ${score.warning ? 'danger' : ''}"><span>评分等级</span><strong>${score.level}</strong></div>
              <div class="score-card"><span>精细得分</span><strong>${fmt(score.score, 1)}分</strong></div>
            </div>
          </div>
          <div class="detail">
            <div class="metric"><span>性别</span><strong>${inputs.sex === 'male' ? '男' : '女'}</strong></div>
            <div class="metric"><span>出生日期</span><strong>${inputs.birthDate}</strong></div>
            <div class="metric"><span>测试日期</span><strong>${inputs.testDate}</strong></div>
            <div class="metric"><span>计算年龄</span><strong>${fmt(inputs.age, 2)} 岁</strong></div>
            <div class="metric"><span>身高</span><strong>${fmt(inputs.height, 1)} cm</strong></div>
            <div class="metric"><span>肺活量</span><strong>${fmt(inputs.vc)} mL</strong></div>
          </div>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>参考百分位</th><th>当前年龄身高对应肺活量</th></tr></thead><tbody>${rows}</tbody></table>
          ${allNotes.length ? `<div class="notice">${allNotes.join(' ')}</div>` : ''}
        </div>`;
    }

    function calculate() {
      const sex = document.getElementById('sex').value;
      const birthDate = document.getElementById('birthDate').value;
      const testDate = document.getElementById('testDate').value;
      const height = Number(document.getElementById('height').value);
      const vc = Number(document.getElementById('vc').value);
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';
      try {
        const age = ageFromDates(birthDate, testDate);
        if (![age, height, vc].every(Number.isFinite)) throw new Error('请填写完整且有效的数字。');
        if (vc <= 0 || height <= 0) throw new Error('身高和肺活量需大于 0。');
        const curve = referenceCurve(sex, age, height);
        const pResult = percentileFromVc(curve.values, vc);
        renderResult({ sex, birthDate, testDate, age, height, vc }, curve.values, pResult, curve.warnings);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    }

    document.getElementById('calcForm').addEventListener('submit', event => { event.preventDefault(); calculate(); });
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('sex').value = 'male';
      document.getElementById('birthDate').value = '2014-01-01';
      document.getElementById('testDate').value = '2026-01-01';
      document.getElementById('height').value = '150';
      document.getElementById('vc').value = '2500';
      calculate();
    });
    calculate();
  </script>
